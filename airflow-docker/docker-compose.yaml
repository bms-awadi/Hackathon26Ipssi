version: '3'

services:

  airflow-webserver:
    image: apache/airflow:2.7.3
    command: bash -c "airflow db migrate && airflow webserver"
    ports:
      - "8081:8080"
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=pytesseract pillow pdf2image
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=lyYH5AKJUGZfCu_ITmp4PwnXUe04KvhLBr1qRLECvhc=
    volumes:
      - ../dags:/opt/airflow/dags
      - ../scripts:/opt/airflow/scripts
      - ../data:/opt/airflow/data

  airflow-scheduler:
    image: apache/airflow:2.7.3
    command: >
      bash -c "
      sleep 10 &&
      airflow db migrate &&
      airflow scheduler
      "
    depends_on:
      - airflow-webserver
    environment:
      - _PIP_ADDITIONAL_REQUIREMENTS=pytesseract pillow pdf2image
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=lyYH5AKJUGZfCu_ITmp4PwnXUe04KvhLBr1qRLECvhc=
    volumes:
      - ../dags:/opt/airflow/dags
      - ../scripts:/opt/airflow/scripts
      - ../data:/opt/airflow/data