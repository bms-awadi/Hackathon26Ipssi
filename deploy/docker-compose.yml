x-airflow-common: &airflow-common
  image: hackathon26-airflow:2.7.3-ocr
  build:
    context: ..
    dockerfile: deploy/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    PYTHONPATH: "/opt/airflow:/opt/airflow/ocr_extraction"
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: 120
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 10
    MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
    MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
    MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    # Align buckets with the cahier (Awadi/Ryma)
    MINIO_BUCKET_RAW: "${MINIO_BUCKET_RAW:-raw-documents}"
    MINIO_BUCKET_CLEAN_TEXTS: "${MINIO_BUCKET_CLEAN_TEXTS:-clean-texts}"
    MINIO_BUCKET_CURATED: "${MINIO_BUCKET_CURATED:-curated}"
    _PIP_ADDITIONAL_REQUIREMENTS: "minio pytesseract pillow pdf2image python-dotenv pdfplumber opencv-python-headless spacy easyocr fr-core-news-lg"
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/scripts:/opt/airflow/scripts
    - ../airflow/data:/opt/airflow/data
    - ../data-lake:/opt/airflow/data_lake
    - ../ocr_extraction:/opt/airflow/ocr_extraction
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:

  # ─────────────────────────────────────────
  # BASE DE DONNÉES — PostgreSQL (Airflow)
  # ─────────────────────────────────────────
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ─────────────────────────────────────────
  # BASE DE DONNÉES — MongoDB (Backend API)
  # ─────────────────────────────────────────
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: always

  # ─────────────────────────────────────────
  # DATA LAKE — MinIO (Responsable : Clément)
  # ─────────────────────────────────────────
  minio:
    image: minio/minio
    ports:
      - "9005:9000"
      - "9006:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/raw-documents;
      mc mb --ignore-existing local/clean-texts;
      mc mb --ignore-existing local/curated;
      # Backward-compat buckets (if older code still uses them)
      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/clean;
      echo 'Buckets créés : raw-documents, clean-texts, curated (+ raw/clean compat)';
      "

  # ─────────────────────────────────────────────────────
  # ORCHESTRATION — Airflow (Responsable : Chaimae)
  # ─────────────────────────────────────────────────────
  airflow-init:
      image: hackathon26-airflow:2.7.3-ocr
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_URL:-postgresql+psycopg2://airflow:airflow@postgres/airflow}
        AIRFLOW__CORE__FERNET_KEY: ''
        AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
        MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
        MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
        MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
        MINIO_BUCKET_RAW: "${MINIO_BUCKET_RAW:-raw-documents}"
        MINIO_BUCKET_CLEAN_TEXTS: "${MINIO_BUCKET_CLEAN_TEXTS:-clean-texts}"
        MINIO_BUCKET_CURATED: "${MINIO_BUCKET_CURATED:-curated}"
        PYTHONPATH: "/opt/airflow:/opt/airflow/ocr_extraction"
      volumes:
        - ../airflow/dags:/opt/airflow/dags
        - ../airflow/scripts:/opt/airflow/scripts
        - ../airflow/data:/opt/airflow/data
        - airflow-logs:/opt/airflow/logs
        - airflow-plugins:/opt/airflow/plugins
        - ../ocr_extraction:/opt/airflow/ocr_extraction
      entrypoint: /bin/bash
      command:
        - -c
        - |
          python -m airflow db migrate
          python -m airflow users create \
            --username ${AIRFLOW_USER:-airflow} \
            --password ${AIRFLOW_PASSWORD:-airflow} \
            --firstname Admin \
            --lastname Admin \
            --role Admin \
            --email admin@example.com || true
          echo "Init termine."

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ─────────────────────────────────────────
  # BACKEND API — Node.js + MongoDB + MinIO
  # ─────────────────────────────────────────
  backend:
    image: hackathon26-backend:0.1
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      MONGODB_URI: "mongodb://mongo:27017/hackathon26"
      JWT_SECRET: "${JWT_SECRET:-change-me}"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET_RAW: "${MINIO_BUCKET_RAW:-raw-documents}"
      MINIO_BUCKET_CLEAN_TEXTS: "${MINIO_BUCKET_CLEAN_TEXTS:-clean-texts}"
      MINIO_BUCKET_CURATED: "${MINIO_BUCKET_CURATED:-curated}"
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_started
      minio:
        condition: service_healthy
    restart: always

volumes:
  postgres-db-volume:
  airflow-logs:
  airflow-plugins:
  minio-data:
  mongo-data:
